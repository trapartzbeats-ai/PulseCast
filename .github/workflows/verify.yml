name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-links
      - run: npm run verify

  package-unpacked:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --install-links
      - run: npm run package:win:dir
      - uses: actions/upload-artifact@v4
        with:
          name: pulsecast-win-unpacked
          path: release-reboot
